<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReddMark</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #ff4500;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --green:   #3fb950;
      --red:     #f85149;
      --r:       8px;
      --font:    'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      width: 320px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      flex-shrink: 0; letter-spacing: -0.5px;
    }

    h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    h1 span { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .card.error   { border-color: var(--red);   color: var(--red);   }
    .card.success { border-color: var(--green);  color: var(--green); }
    .card.warning { border-color: #d29922;       color: #d29922;      }

    #info { display: none; }
    #info .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    #info .value { color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #info .meta  { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    #info .meta span { font-size: 11px; color: var(--muted); }
    #info .meta b { color: var(--text); }

    .options { display: flex; flex-direction: column; gap: 7px; }
    .option-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
      cursor: pointer; user-select: none;
    }
    .option-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

    button {
      width: 100%;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .08s;
      letter-spacing: .2px;
    }
    button:hover  { background: #e03d00; }
    button:active { transform: scale(.98); }
    button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }

    footer { text-align: center; font-size: 10px; color: var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="logo">Rm</div>
    <h1>ReddMark <span>Download Reddit threads as Markdown</span></h1>
  </header>

  <div id="status" class="card">Checking page…</div>

  <div id="info" class="card">
    <div class="label">Thread</div>
    <div class="value" id="info-title"></div>
    <div class="meta">
      <span>r/<b id="info-sub"></b></span>
      <span>u/<b id="info-author"></b></span>
      <span><b id="info-comments"></b> comments</span>
      <span>↑<b id="info-score"></b></span>
    </div>
  </div>

  <div class="options">
    <label class="option-row">
      <input type="checkbox" id="opt-meta" checked />
      Include metadata (author, score, date, URL)
    </label>
    <label class="option-row">
      <input type="checkbox" id="opt-body" checked />
      Include post body text
    </label>
  </div>

  <button id="btn" disabled>Download .md</button>

  <footer>Works on reddit.com &amp; old.reddit.com</footer>

  <script src="markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
